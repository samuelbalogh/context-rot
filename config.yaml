      - id: django_cache_key_format
        question: "What is the default format for Django cache keys (key_prefix, version, key)?"
        answer: "key_prefix:version:key"
        needle: |
          return "%s:%s:%s" % (key_prefix, version, key)
        fake_needles:
          - "key:version:key_prefix"
          - "version:key_prefix:key"
