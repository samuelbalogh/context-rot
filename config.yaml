        fake_needles:
          - "Split by dot"
          - "Split by slash"
      - id: django_reverse_viewname_code_style
        question: "When reversing a namespaced URL, how does Django split the viewname to get the namespace path and view?"
        answer: "Split by colon, last part is the view"
        needle: |
